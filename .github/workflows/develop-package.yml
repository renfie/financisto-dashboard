name: Package development ZIP

on:
  push:
    branches: [develop]
    paths:
      - 'package/VERSION'
      - 'package/src/app.py'
      - 'package/templates/bookings.html'
      - '.github/workflows/develop-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check developer source
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n update.sh
          python3 -m compileall -q package/src
          python3 -m unittest discover -s package/tests -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          t=Path('package/templates/bookings.html').read_text()
          s=Path('package/src/app.py').read_text()
          assert "('category','Kategorie')" in t
          assert 'data-label="Kategorie"' in t
          assert 'colspan="8"' in t
          assert "if sort_key == 'category':" in s
          assert Path('package/VERSION').read_text().strip() == '1.9.61-dev.2'
          print('Category list and sorting checks passed')
          PY
      - name: Build full development update ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < package/VERSION)"
          ROOT="financisto-release-$VERSION"
          mkdir -p "$RUNNER_TEMP/$ROOT"
          cp -a package update.sh setup_financisto_sftp.sh README.txt README.md README.de.md LICENSE NOTICE.md CHANGELOG.md CHANGELOG.en.md docs "$RUNNER_TEMP/$ROOT/"
          (cd "$RUNNER_TEMP" && zip -q -r "$GITHUB_WORKSPACE/financisto-dashboard-v$VERSION.zip" "$ROOT")
          sha256sum "financisto-dashboard-v$VERSION.zip" > "financisto-dashboard-v$VERSION.zip.sha256"
          unzip -tq "financisto-dashboard-v$VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: financisto-dashboard-v1.9.61-dev.2
          path: |
            financisto-dashboard-v1.9.61-dev.2.zip
            financisto-dashboard-v1.9.61-dev.2.zip.sha256
          retention-days: 14
          if-no-files-found: error
