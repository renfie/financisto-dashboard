name: Export source snapshot for localization build
on:
  push:
    paths:
      - '.github/workflows/source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive --format=zip --output=financisto-source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: financisto-source-snapshot
          path: financisto-source-snapshot.zip
          retention-days: 1
