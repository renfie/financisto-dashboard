name: financisto-dashboard
services:
  dashboard:
    image: financisto-dashboard:1.9.61-dev.2
    build: .
    container_name: financisto-dashboard-app
    restart: unless-stopped
    # Services write Bind-Mount data as the Linux owner selected during installation.
    user: "${APP_UID:?APP_UID fehlt - bitte install.sh ausführen}:${APP_GID:?APP_GID fehlt - bitte install.sh ausführen}"
    environment:
      DATABASE_PATH: /data/finanzen.sqlite3
      APP_SECRET_FILE: /run/finance-secrets/app_secret
      ADMIN_PASSWORD_HASH_FILE: /run/finance-secrets/admin_password_hash
      INITIAL_IP_FILE: /run/finance-secrets/initial_ip
      ADMIN_USERNAME: admin
      # Editable in .env and preserved through future updates; no DB migration.
      APP_TITLE: ${APP_TITLE:-Financisto}
      APP_SUBTITLE: ${APP_SUBTITLE:-Dashboard}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-de}
      APP_FOOTER: ${APP_FOOTER:-Privates Finanz-Dashboard · Daten bleiben auf deinem Server}
      APP_FOOTER_EN: ${APP_FOOTER_EN:-}
      # Only opt in AFTER the administrator enrolled TOTP and NPM HTTPS is configured.
      PUBLIC_ACCESS: ${PUBLIC_ACCESS:-0}
    volumes:
      - ./data:/data
      - ./secrets:/run/finance-secrets:ro
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  background:
    image: financisto-dashboard:1.9.61-dev.2
    container_name: financisto-dashboard-background
    restart: unless-stopped
    user: "${APP_UID:?APP_UID fehlt}:${APP_GID:?APP_GID fehlt}"
    entrypoint: ["python", "-u", "/app/background_worker.py", "--daemon"]
    network_mode: "none"
    environment:
      DATABASE_PATH: /data/finanzen.sqlite3
      SYNC_INBOX_PATH: /data/inbox
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=24m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import os; import sys; sys.exit(0 if open('/proc/1/cmdline','rb').read().find(b'background_worker.py')>=0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  notifications:
    image: financisto-dashboard:1.9.61-dev.2
    container_name: financisto-dashboard-notifications
    restart: unless-stopped
    user: "${APP_UID:?APP_UID fehlt}:${APP_GID:?APP_GID fehlt}"
    entrypoint: ["python", "-u", "/app/notifications.py"]
    # Outbound sender and direct Telegram poller, without public ports.
    networks:
      - outbound
    environment:
      DATABASE_PATH: /data/finanzen.sqlite3
      APP_SECRET_FILE: /run/finance-secrets/app_secret
      VAPID_SUBJECT: https://${SITE_HOST:-finance.example.org}
    volumes:
      - ./data:/data
      - ./secrets/app_secret:/run/finance-secrets/app_secret:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    container_name: financisto-dashboard-caddy
    restart: unless-stopped
    user: "${APP_UID:?APP_UID fehlt - bitte install.sh ausführen}:${APP_GID:?APP_GID fehlt - bitte install.sh ausführen}"
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      SITE_HOST: ${SITE_HOST:?Bitte zuerst ./install.sh ausführen}
      SITE_ADDRESSES: ${SITE_ADDRESSES:?SITE_ADDRESSES fehlt - bitte Update/Installation ausführen}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1/32}
    ports:
      - "${HTTPS_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-8443}:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - private
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Niedrige Ports <1024 benötigt Caddy ggf. CAP_NET_BIND_SERVICE.
    cap_add:
      - NET_BIND_SERVICE

networks:
  private:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

  outbound:
    driver: bridge
